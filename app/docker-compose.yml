version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
    networks:
      - fraud-network

  frontend:
    build:
      context: .
      dockerfile: app/Dockerfile.frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - PYTHONPATH=/app
    networks:
      - fraud-network

networks:
  fraud-network:
    driver: bridge